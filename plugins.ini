# Configuration for building the combined Velero plugin image.
# path = The exact path to the binary inside the source image.

[plugin:aws]
image = catalogicsoftware/velero-plugin-for-aws:1.14.0.3
path = /plugins/velero-plugin-for-aws

[plugin:gcp]
image = catalogicsoftware/velero-plugin-for-gcp:v1.14.4.1
path = /plugins/velero-plugin-for-gcp

[plugin:azure]
image = velero/velero-plugin-for-microsoft-azure:v1.14.4
path = /plugins/velero-plugin-for-microsoft-azure

[plugin:kubevirt]
image = catalogicsoftware/kubevirt-velero-plugin:0.9.1.1
path = /plugins/kubevirt-velero-plugin

[plugin:amds]
image = catalogicsoftware/amds-veleroplugin:3.1.0-master.432
path = /plugins/catalogicsoftware-velero-plugin

[velero]
image = catalogicsoftware/velero:v1.18.4-master.0
